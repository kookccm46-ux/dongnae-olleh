<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>동래올래 스탬프투어</title><link rel="icon" href="favicon-32x32.png"><link rel="stylesheet" href="css/style.css">
<style>
.stamp-page{margin:0;color:#49372f;background:#fff}.stamp-page .site-header{position:relative;height:76px}.stamp-page .site-header nav{font-family:'SchoolSafetyRoundedSmile',sans-serif;font-weight:700}
.tour-hero{position:relative;aspect-ratio:3840/1638;background:url('images7/Rectangle_320.png') center/cover no-repeat;text-align:center}.tour-hero h1{position:absolute;top:20%;left:0;width:100%;margin:0}.tour-hero h1 img{width:25%;margin:auto}.tour-hero p{position:absolute;top:64%;left:0;width:100%;margin:0;font-family:'Pretendard',sans-serif;font-size:clamp(17px,2.1vw,38px);line-height:1.2}
.tour-map{position:relative;padding:90px 0 0;background:#fff2e7 url('images7/hanzi_background.png') center top/100% 100% no-repeat;overflow:hidden}.tour-heading{display:flex;justify-content:center;align-items:center;gap:.18em;margin:0 auto 65px;font:700 clamp(23px,2.6vw,42px)/1.4 'SchoolSafetyRoundedSmile',sans-serif}.tour-heading img{width:1.15em;height:1.15em;object-fit:contain}
.tour-route{width:min(1420px,72%);margin:auto;position:relative;isolation:isolate}.route-road{position:absolute;left:42%;top:0;width:16%;height:100%;object-fit:fill;z-index:-1;pointer-events:none}.tour-stops{list-style:none;padding:0;margin:0}.tour-stop{position:relative;height:clamp(300px,28vw,540px)}
.landmark{position:absolute;top:0;left:0;width:44%;margin:0;text-align:center;--enter-x:-65px}.tour-stop:nth-child(even) .landmark{left:auto;right:0;--enter-x:65px}.landmark img{width:100%;height:clamp(150px,17vw,310px);object-fit:contain}.landmark figcaption{font:700 clamp(18px,1.9vw,32px)/1.4 'Pretendard',sans-serif;margin:18px 0 0}
.footsteps{position:absolute;top:58%;left:38%;width:24%;height:45%;pointer-events:none}.tour-stop:nth-child(even) .footsteps{left:29%}.footsteps img{width:100%;height:100%;object-fit:contain}.footsteps::after{content:'';position:absolute;inset:0;background:transparent}.js-motion .footsteps img{opacity:.1;mask-image:linear-gradient(to bottom,#000 0%,#000 var(--trail-solid,0%),#0002 var(--trail-end,0%),#0002 100%);-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 var(--trail-solid,0%),#0002 var(--trail-end,0%),#0002 100%)}
.guide{position:absolute;width:29%;--enter-x:0px}.guide>img{display:block;width:100%;height:auto}.guide-wave{left:5%;top:-5%;}.guide-map{right:13%;top:22%;width:20%}.scenery{position:absolute;pointer-events:none}.hills{width:24%;left:0;top:15%;}.first-hills{left:auto;right:11%;top:65%;}.trees{right:-2%;top:20%;width:20%;height:200px}.trees img:first-child{position:absolute;right:0;width:58%;top:0}.trees img:last-child{position:absolute;left:0;width:65%;top:45%}.guide-map::after{content:'';position:absolute;left:115%;top:-10%;width:70%;height:80%;background:url('images7/tree3_1.png') right top/60% auto no-repeat,url('images7/tree6_1.png') left bottom/70% auto no-repeat}
.js-motion .reveal{opacity:0;transform:translate(var(--enter-x,0px),35px) scale(.96);transition:opacity 1.15s ease,transform 1.35s cubic-bezier(.18,.7,.25,1)}.js-motion .reveal.is-visible{opacity:1;transform:translate(0,0) scale(1)}
.tour-finish{position:relative;text-align:center;padding:35px 0 100px;--enter-x:0px}.tour-finish img{width:34%;max-width:470px;margin:auto}.tour-finish p{font:800 clamp(24px,2.4vw,40px)/1.3 'Pretendard',sans-serif;margin:40px 0 0}.cloud-bank{position:relative;height:clamp(90px,10vw,190px);margin-top:-35px}.finish-cloud{position:absolute;width:25%;max-width:520px;pointer-events:none;will-change:transform;animation:cloud-float 7s ease-in-out infinite}.finish-cloud.left{left:10%;top:25%}.finish-cloud.right{right:3%;top:0;animation-duration:9s;animation-delay:-3s}@keyframes cloud-float{0%,100%{transform:translate3d(-8px,7px,0) rotate(-1deg)}50%{transform:translate3d(12px,-13px,0) rotate(1deg)}}.tour-landscape{display:block;width:100%;height:auto;margin-top:10px}.stamp-page .site-footer{min-height:0;padding:55px 24px 32px;background:#578875}.stamp-page .site-footer::before{display:none}.stamp-page .site-footer img{width:210px;height:auto;margin:0 auto 25px}.stamp-page .site-footer small{font:600 14px/1.5 'Pretendard',sans-serif;color:#44362e}
@media(max-width:700px){.stamp-page .site-header{height:auto}.tour-hero{aspect-ratio:1.4;background-position:center}.tour-hero h1{top:20%}.tour-hero h1 img{width:43%}.tour-hero p{top:68%;font-size:20px}.tour-map{padding-top:55px}.tour-heading{margin-bottom:45px}.tour-route{width:94%}.tour-stop{height:300px}.landmark{width:46%}.landmark img{height:145px}.landmark figcaption{font-size:16px;margin-top:8px}.footsteps{top:56%;height:43%;width:25%}.guide-wave{width:32%;top:12%}.guide-map{width:23%;right:14%;top:20%}.trees{height:120px;top:35%}.first-hills{top:66%}.tour-finish{padding:0 0 65px}.tour-finish img{width:48%}.tour-finish p{margin-top:25px}.stamp-page .site-footer{padding-top:35px}.stamp-page .site-footer img{width:150px}}
@media(prefers-reduced-motion:reduce){.js-motion .reveal{opacity:1;transform:none;transition:none}.finish-cloud{animation:none!important}.js-motion .footsteps img{opacity:1!important;mask-image:none!important;-webkit-mask-image:none!important}}
</style></head><body class="stamp-page"><div id="wrap">

  </header>
<main><section class="tour-hero"><h1><img src="images7/stamplogo.png" alt="동래올래 스탬프투어"></h1><p>스탬프 찍고 돌아보고<br>경품받고!</p></section>
<section class="tour-map" aria-labelledby="tour-heading"><h2 class="tour-heading" id="tour-heading"><img src="images7/cf3.png" alt="">스탬프투어 약도<img src="images7/cf3.png" alt=""></h2>
<div class="tour-route"><img class="route-road" src="images7/road.png" alt=""><ol class="tour-stops"><li class="tour-stop"><figure class="landmark reveal"><img src="images7/1934_train.png" alt="1934 기차 동래역 건물 그림"><figcaption>1934 기차 동래역</figcaption></figure><img class="scenery hills first-hills" src="images7/san2.png" alt=""><div class="footsteps" aria-hidden="true"><img src="images7/footprint_1.png" alt=""></div></li><li class="tour-stop"><figure class="landmark reveal"><img src="images7/tradition.png" alt="동래시장 건물 그림"><figcaption>동래시장</figcaption></figure><div class="guide guide-wave reveal"><img src="images7/guide2.png" alt="깃발을 든 안내 새"></div><div class="footsteps" aria-hidden="true"><img src="images7/footprint_3.png" alt=""></div></li><li class="tour-stop"><figure class="landmark reveal"><img src="images7/daemoon.png" alt="동래장관청 건물 그림"><figcaption>동래장관청</figcaption></figure><div class="guide guide-map reveal"><img src="images7/guide1.png" alt="지도를 보는 안내 새"></div><div class="footsteps" aria-hidden="true"><img src="images7/footprint_4.png" alt=""></div></li><li class="tour-stop"><figure class="landmark reveal"><img src="images7/sachal.png" alt="동래향교 건물 그림"><figcaption>동래향교</figcaption></figure><img class="scenery hills" src="images7/san.png" alt=""><div class="footsteps" aria-hidden="true"><img src="images7/footprint_6.png" alt=""></div></li><li class="tour-stop"><figure class="landmark reveal"><img src="images7/museum.png" alt="복천박물관 건물 그림"><figcaption>복천박물관</figcaption></figure><div class="scenery trees"><img src="images7/tree3_1.png" alt=""><img src="images7/tree6_1.png" alt=""></div><div class="footsteps" aria-hidden="true"><img src="images7/footprint_5.png" alt=""></div></li><li class="tour-stop"><figure class="landmark reveal"><img src="images7/sticker.png" alt="동래읍성 건물 그림"><figcaption>동래읍성</figcaption></figure></li></ol></div>
<div class="tour-finish reveal"><img src="images7/highfive.png" alt="스탬프투어를 마치고 하이파이브하는 두 안내 새"><p>FINISHED!</p></div></section></main>

<script>
(() => {
  'use strict';
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const reveals = [...document.querySelectorAll('.reveal')];
  const trails = [...document.querySelectorAll('.footsteps')];
  let framePending = false;
  document.documentElement.classList.add('js-motion');
  function update() {
    framePending = false;
    const viewport = window.innerHeight;
    reveals.forEach(element => {
      // Also reveal already-passed stops after a fast scroll or restored position.
      if (reducedMotion.matches || element.getBoundingClientRect().top < viewport * .84) {
        element.classList.add('is-visible');
      }
    });
    trails.forEach(trail => {
      const bounds = trail.getBoundingClientRect();
      const progress = reducedMotion.matches ? 1 : Math.min(1, Math.max(0,
        (viewport * .9 - bounds.top) / Math.max(1, bounds.height + viewport * .1)));
      const reached = Math.max(Number(trail.dataset.progress || 0), progress);
      trail.dataset.progress = String(reached);
      trail.style.setProperty('--trail-solid', Math.max(0, reached * 120 - 20) + '%');
      trail.style.setProperty('--trail-end', Math.min(100, reached * 120) + '%');
      trail.firstElementChild.style.opacity = String(.12 + .88 * reached);
    });
  }
  function schedule() {
    if (!framePending) { framePending = true; requestAnimationFrame(update); }
  }
  window.addEventListener('scroll', schedule, { passive: true });
  window.addEventListener('resize', schedule);
  window.addEventListener('load', schedule);
  window.addEventListener('pageshow', schedule);
  reducedMotion.addEventListener('change', schedule);
  schedule();
})();
</script></body></html>
