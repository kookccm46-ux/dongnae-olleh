/* Goods page only: shared header/footer styles are preserved. */
@font-face{font-family:'SchoolSafetyRoundedSmile';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-5@1.0/HakgyoansimDunggeunmisoTTF-R.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'SchoolSafetyRoundedSmile';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-5@1.0/HakgyoansimDunggeunmisoTTF-B.woff2') format('woff2');font-weight:700;font-display:swap}
.shop-main{color:#493532}
.shop-flower{display:inline-block;width:.9em;height:.9em;object-fit:contain;flex-shrink:0}
.shop-photo:focus-visible{outline:3px solid #c56442;outline-offset:5px}
.shop-catalog{background:#fff2e7 url('images8/hanzi_background.png') center top/100% auto;padding:150px 24px 190px}

.shop-products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:130px 100px;max-width:1160px;margin:auto}
.shop-product{margin:0;min-width:0;text-align:center}
.shop-photo{position:relative;aspect-ratio:530/481;overflow:hidden;background:#fff1e7}
.shop-photo img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;transition:opacity .3s ease}
.shop-photo .shop-alternate{object-fit:contain;opacity:0;background:#fff1e7}
.shop-photo:hover .shop-alternate,.shop-photo:focus .shop-alternate{opacity:1}
.shop-photo:hover .shop-original,.shop-photo:focus .shop-original{opacity:0}
.shop-product figcaption{background:#fff1e8;padding:12px 8px 22px}
.shop-product h3{font:700 clamp(21px,1.9vw,36px)/1.35 'SchoolSafetyRoundedSmile',sans-serif;margin:0 0 10px;word-break:keep-all}
.shop-product p{font:700 clamp(20px,1.8vw,34px)/1.5 'Pretendard',sans-serif;margin:0}

@media(max-width:480px){.shop-products{grid-template-columns:1fr;max-width:530px;gap:48px}.shop-catalog{padding:60px 24px 80px}.shop-title{margin-bottom:45px}.shop-product h3{font-size:25px}.shop-product p{font-size:23px}}
@media(prefers-reduced-motion:reduce){.shop-photo img{transition:none}}


/* Two equally sized slides with fixed arrows and softly blending backgrounds. */
.shop-banner{position:relative;isolation:isolate;aspect-ratio:1918/929;overflow:hidden;text-align:center;background:#f5e7d9 url('images8/Rectangle_332.png') center/100% 100% no-repeat}
.shop-banner::before{content:'';position:absolute;inset:0;background:#dfbba5 url('images8/Rectangle_330.png') center/100% 100% no-repeat;opacity:0;transition:opacity 1.2s ease-in-out;pointer-events:none}
.shop-banner.is-detail::before{opacity:1}
.shop-banner-track{position:absolute;inset:0 auto 0 0;width:200%;display:flex;transform:translateX(0);transition:transform 1.2s cubic-bezier(.45,0,.2,1);will-change:transform}
.shop-banner.is-detail .shop-banner-track{transform:translateX(-50%)}
.shop-banner-panel{position:relative;flex:0 0 50%;height:100%}
.shop-banner-photo{position:absolute;left:16.11%;top:8.4%;width:67.78%;aspect-ratio:1300/667}
.shop-banner-photo>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.shop-banner-details .shop-banner-photo>img{opacity:0;transition:opacity .65s ease}
.shop-banner-details .shop-banner-photo>img.is-current{opacity:1}
.shop-banner h1{position:absolute;z-index:1;left:7%;right:7%;bottom:7%;margin:0;display:flex;align-items:center;justify-content:center;gap:.15em;font:700 clamp(16px,3.4vw,64px)/1.3 'SchoolSafetyRoundedSmile',sans-serif;letter-spacing:-.025em}
.shop-banner-arrow{position:absolute;z-index:2;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:clamp(32px,5vw,72px);height:clamp(32px,5vw,72px);padding:0;border:0;border-radius:50%;background:#facbb1;color:#513c32;font:700 clamp(20px,3vw,44px)/1 sans-serif;cursor:pointer;transition:background-color 1.2s ease,color 1.2s ease,box-shadow .2s ease}
.shop-banner-prev{left:2.7%}.shop-banner-next{right:2.7%}
.shop-banner.is-detail .shop-banner-arrow{background:#513c32;color:#ffe7d6}

@media(prefers-reduced-motion:reduce){.shop-banner-track,.shop-banner::before,.shop-banner-arrow,.shop-banner-details .shop-banner-photo>img{transition:none}}


/* Goods cards enter gently as the visitor scrolls down. */
.shop-reveal-ready .shop-product{opacity:0;transform:translateY(35px) scale(.96);transition:opacity 1.15s ease,transform 1.35s cubic-bezier(.18,.7,.25,1)}

.shop-reveal-ready .shop-product.is-revealed{opacity:1;transform:translateY(0) scale(1)}
.shop-reveal-ready .shop-product:focus-within{opacity:1;transform:none;transition-delay:0s}
@media(max-width:480px){.shop-reveal-ready .shop-product:nth-child(even){transition-delay:0s}}
@media(prefers-reduced-motion:reduce){.shop-reveal-ready .shop-product{opacity:1;transform:none;transition:none}}
@media print{.shop-reveal-ready .shop-product{opacity:1;transform:none;transition:none}}

<script>

(() => {
  const banner = document.querySelector('.shop-banner');
  const overview = document.querySelector('.shop-banner-overview');
  const details = document.querySelector('.shop-banner-details');
  const slides = [...details.querySelectorAll('img')];
  const arrows = [...banner.querySelectorAll('.shop-banner-arrow')];
  let current = 0, detailOpen = false, timer, ready = false;
  function start() {
    clearInterval(timer);
    if (!detailOpen || !ready || document.hidden) return;
    timer = setInterval(() => {
      slides[current].classList.remove('is-current');
      current = (current + 1) % slides.length;
      slides[current].classList.add('is-current');
    }, 2000);
  }
  function changeBanner() {
    detailOpen = !detailOpen;
    banner.classList.toggle('is-detail', detailOpen);
    overview.setAttribute('aria-hidden', String(detailOpen));
    details.setAttribute('aria-hidden', String(!detailOpen));
    overview.inert = detailOpen;
    details.inert = !detailOpen;
    if (detailOpen) {
      slides[current].classList.remove('is-current');
      current = 0;
      slides[current].classList.add('is-current');
    }
    start();
  }
  arrows.forEach(button => button.addEventListener('click', changeBanner));
  banner.addEventListener('keydown', event => {
    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
      event.preventDefault();
      changeBanner();
    }
  });
  document.addEventListener('visibilitychange', start);
  Promise.allSettled(slides.map(image => image.decode())).then(() => {
    ready = true;
    start();
  });
})();
</script>
<script>

(() => {
  const grid = document.querySelector('.shop-products');
  if (!grid || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const pending = new Set(grid.querySelectorAll('.shop-product'));
  let scheduled = false;
  function reveal(card) {
    card.classList.add('is-revealed');
    pending.delete(card);
  }
  function update() {
    scheduled = false;
    // Include already-passed cards after fast scrolling or restoring scroll position.
    const trigger = window.innerHeight * .88;
    pending.forEach(card => {
      if (card.getBoundingClientRect().top < trigger) reveal(card);
    });
    if (!pending.size) {
      window.removeEventListener('scroll', schedule);
      window.removeEventListener('resize', schedule);
      window.removeEventListener('pageshow', schedule);
    }
  }
  function schedule() {
    if (!scheduled) {
      scheduled = true;
      window.requestAnimationFrame(update);
    }
  }
  grid.addEventListener('focusin', event => {
    const card = event.target.closest('.shop-product');
    if (card) reveal(card);
  });
  grid.classList.add('shop-reveal-ready');
  window.addEventListener('scroll', schedule, { passive: true });
  window.addEventListener('resize', schedule);
  window.addEventListener('pageshow', schedule);
  update();
})();
</script>
